<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, sans-serif">
<rect width="1200" height="640" fill="#F0F4F9"/>
<text x="60" y="78" font-size="44" font-weight="700" fill="#17181A">HASP</text>
<text x="195" y="78" font-size="20"  fill="#3F4143">Client-surface hardening, declared and checked</text>
<text x="60" y="112" font-size="18" font-style="italic" fill="#1E4E8C">The hardening a page declares to the browser, checked for effect.</text>
<rect x="60" y="145" width="330" height="300" rx="10" fill="#FFFFFF" stroke="#C9CDD1"/>
<text x="84" y="185" font-size="16" font-weight="700" fill="#3F4143">Why It Exists</text>
<text x="84" y="218" font-size="17" font-weight="600" fill="#17181A">Fast builds skip it.</text>
<text x="84" y="240" font-size="15"  fill="#3F4143">They optimize the visible app</text>
<text x="84" y="260" font-size="15"  fill="#3F4143">and never touch the response.</text>
<text x="84" y="296" font-size="17" font-weight="600" fill="#17181A">The headers a browser</text>
<text x="84" y="318" font-size="15"  fill="#3F4143">would enforce are simply</text>
<text x="84" y="338" font-size="15"  fill="#3F4143">absent from the response.</text>
<text x="84" y="374" font-size="17" font-weight="600" fill="#17181A">And present is not enough:</text>
<text x="84" y="396" font-size="15"  fill="#3F4143">a CSP with unsafe-inline, a</text>
<text x="84" y="416" font-size="15"  fill="#3F4143">tiny HSTS, certify nothing.</text>
<rect x="420" y="145" width="400" height="300" rx="10" fill="#FFFFFF" stroke="#C9CDD1"/>
<text x="444" y="185" font-size="16" font-weight="700" fill="#3F4143">What It Covers</text>
<text x="444" y="220" font-size="16" font-weight="600" fill="#17181A">Response headers</text>
<text x="444" y="240" font-size="15"  fill="#3F4143">CSP, clickjacking, HSTS, nosniff</text>
<text x="444" y="272" font-size="16" font-weight="600" fill="#17181A">Markup integrity</text>
<text x="444" y="292" font-size="15"  fill="#3F4143">SRI, rel=noopener, no mixed content</text>
<text x="444" y="324" font-size="16" font-weight="600" fill="#17181A">Secrets</text>
<text x="444" y="344" font-size="15"  fill="#3F4143">no keys in the bundle, keys in the browser</text>
<text x="444" y="378" font-size="15"  fill="#3F4143">The keys part is HASP-KEY, shipped as the</text>
<text x="444" y="398" font-size="15"  fill="#3F4143">hasp-key package. The auditor checks all</text>
<text x="444" y="418" font-size="15"  fill="#3F4143">three; the header generators come next.</text>
<rect x="850" y="145" width="290" height="300" rx="10" fill="#FFFFFF" stroke="#C9CDD1"/>
<text x="874" y="185" font-size="16" font-weight="700" fill="#3F4143">The Honest Limit</text>
<text x="874" y="236" font-size="40" font-weight="700" fill="#255D34">3 altitudes</text>
<text x="874" y="264" font-size="15"  fill="#3F4143">headers, integrity, secrets,</text>
<text x="874" y="284" font-size="15"  fill="#3F4143">checked for effect.</text>
<text x="874" y="324" font-size="17" font-weight="600" fill="#17181A">Never "secure"</text>
<text x="874" y="346" font-size="15"  fill="#3F4143">it states what was checked,</text>
<text x="874" y="366" font-size="15"  fill="#3F4143">not that a site is safe.</text>
<text x="874" y="400" font-size="17" font-weight="600" fill="#17181A">Header over meta</text>
<text x="874" y="422" font-size="15"  fill="#3F4143">reads the served response,</text>
<text x="874" y="442" font-size="15"  fill="#3F4143">not an injected tag.</text>
<rect x="60" y="480" width="1080" height="110" rx="10" fill="#FFFFFF" stroke="#C9CDD1"/>
<text x="84" y="516" font-size="16" font-weight="700" fill="#3F4143">Against the Field</text>
<text x="84" y="544" font-size="16" font-weight="600" fill="#1E4E8C">vs a security kit</text>
<text x="84" y="564" font-size="14"  fill="#3F4143">zero-dependency,</text>
<text x="84" y="581" font-size="14"  fill="#3F4143">nothing calls home</text>
<text x="349" y="544" font-size="16" font-weight="600" fill="#1E4E8C">vs a scanner</text>
<text x="349" y="564" font-size="14"  fill="#3F4143">a self-audit, not a</text>
<text x="349" y="581" font-size="14"  fill="#3F4143">scan-anyone weapon</text>
<text x="614" y="544" font-size="16" font-weight="600" fill="#1E4E8C">vs a secure badge</text>
<text x="614" y="564" font-size="14"  fill="#3F4143">states what was checked,</text>
<text x="614" y="581" font-size="14"  fill="#3F4143">re-provable</text>
<text x="879" y="544" font-size="16" font-weight="600" fill="#1E4E8C">vs nothing</text>
<text x="879" y="564" font-size="14"  fill="#3F4143">the surface declares</text>
<text x="879" y="581" font-size="14"  fill="#3F4143">its posture at last</text>
<text x="1140" y="622" font-size="13" fill="#3F4143" text-anchor="end">Apache-2.0 &#183; part of DS4AI, the Design Suite for AI</text>
</svg>
