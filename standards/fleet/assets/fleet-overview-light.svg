<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, sans-serif">
<rect width="1200" height="640" fill="#F0F4F9"/>
<text x="60" y="78" font-size="44" font-weight="700" fill="#17181A">FLEET</text>
<text x="210" y="78" font-size="20"  fill="#3F4143">Fast Loads, Every Element Timed</text>
<text x="60" y="112" font-size="18" font-style="italic" fill="#1E4E8C">Fast and stable, and honest about its edge.</text>
<rect x="60" y="145" width="330" height="300" rx="10" fill="#FFFFFF" stroke="#C9CDD1"/>
<text x="84" y="185" font-size="16" font-weight="700" fill="#3F4143">Why It Exists</text>
<text x="84" y="218" font-size="17" font-weight="600" fill="#17181A">A page can look finished</text>
<text x="84" y="240" font-size="15"  fill="#3F4143">and still be slow and janky</text>
<text x="84" y="260" font-size="15"  fill="#3F4143">under measurement.</text>
<text x="84" y="296" font-size="17" font-weight="600" fill="#17181A">An oversized hero</text>
<text x="84" y="318" font-size="15"  fill="#3F4143">arrives late; content jumps</text>
<text x="84" y="338" font-size="15"  fill="#3F4143">as images and fonts load.</text>
<text x="84" y="374" font-size="17" font-weight="600" fill="#17181A">That damage is invisible</text>
<text x="84" y="396" font-size="15"  fill="#3F4143">until measured, which is</text>
<text x="84" y="416" font-size="15"  fill="#3F4143">when a fast build skips it.</text>
<rect x="420" y="145" width="400" height="300" rx="10" fill="#FFFFFF" stroke="#C9CDD1"/>
<text x="444" y="185" font-size="16" font-weight="700" fill="#3F4143">What It Emits</text>
<text x="444" y="220" font-size="16" font-weight="600" fill="#17181A">Responsive image markup</text>
<text x="444" y="240" font-size="15"  fill="#3F4143">reserved dimensions, correct scheduling</text>
<text x="444" y="272" font-size="16" font-weight="600" fill="#17181A">Resource hints and font tags</text>
<text x="444" y="292" font-size="15"  fill="#3F4143">plus a cache-header config generator</text>
<text x="444" y="324" font-size="16" font-weight="600" fill="#17181A">A delivery auditor</text>
<text x="444" y="344" font-size="15"  fill="#3F4143">and a Speculation Rules generator</text>
<text x="444" y="378" font-size="15"  fill="#3F4143">Checked against Core Web Vitals:</text>
<text x="444" y="398" font-size="15"  fill="#3F4143">Largest Contentful Paint, Cumulative</text>
<text x="444" y="418" font-size="15"  fill="#3F4143">Layout Shift, Interaction to Next Paint.</text>
<rect x="850" y="145" width="290" height="300" rx="10" fill="#FFFFFF" stroke="#C9CDD1"/>
<text x="874" y="185" font-size="16" font-weight="700" fill="#3F4143">Honest About Its Edge</text>
<text x="874" y="236" font-size="40" font-weight="700" fill="#255D34">Emit, audit</text>
<text x="874" y="264" font-size="15"  fill="#3F4143">the markup and config,</text>
<text x="874" y="284" font-size="15"  fill="#3F4143">never the bytes.</text>
<text x="874" y="324" font-size="17" font-weight="600" fill="#17181A">It cannot</text>
<text x="874" y="346" font-size="15"  fill="#3F4143">encode a pixel, bundle a</text>
<text x="874" y="366" font-size="15"  fill="#3F4143">module, or set a header.</text>
<text x="874" y="400" font-size="17" font-weight="600" fill="#17181A">It marks the boundary</text>
<text x="874" y="422" font-size="15"  fill="#3F4143">rather than pretending</text>
<text x="874" y="442" font-size="15"  fill="#3F4143">to cross it.</text>
<rect x="60" y="480" width="1080" height="110" rx="10" fill="#FFFFFF" stroke="#C9CDD1"/>
<text x="84" y="516" font-size="16" font-weight="700" fill="#3F4143">Against the Field</text>
<text x="84" y="544" font-size="16" font-weight="600" fill="#1E4E8C">vs perf plugins</text>
<text x="84" y="564" font-size="14"  fill="#3F4143">transparent markup,</text>
<text x="84" y="581" font-size="14"  fill="#3F4143">no black box</text>
<text x="349" y="544" font-size="16" font-weight="600" fill="#1E4E8C">vs framework defaults</text>
<text x="349" y="564" font-size="14"  fill="#3F4143">catches the misses</text>
<text x="349" y="581" font-size="14"  fill="#3F4143">they still ship</text>
<text x="614" y="544" font-size="16" font-weight="600" fill="#1E4E8C">vs a score</text>
<text x="614" y="564" font-size="14"  fill="#3F4143">the fix, not just</text>
<text x="614" y="581" font-size="14"  fill="#3F4143">a number</text>
<text x="879" y="544" font-size="16" font-weight="600" fill="#1E4E8C">vs nothing</text>
<text x="879" y="564" font-size="14"  fill="#3F4143">the jank is caught</text>
<text x="879" y="581" font-size="14"  fill="#3F4143">before ship</text>
<text x="1140" y="622" font-size="13" fill="#3F4143" text-anchor="end">Apache-2.0 &#183; part of DS4AI, the Design Suite for AI</text>
</svg>
